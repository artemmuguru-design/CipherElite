<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChugurHub - мобильный GitHub</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #58a6ff;
            --green: #238636;
            --red: #da3633;
            --muted: #8b949e;
            --purple: #a371f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Шапка */
        .header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .logo-icon {
            font-size: 24px;
        }

        .logo h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #58a6ff, #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: var(--green);
            border-color: var(--green);
            color: white;
        }

        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .btn-danger {
            background: transparent;
            border-color: var(--red);
            color: var(--red);
        }

        /* Вкладки */
        .tabs {
            display: flex;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            user-select: none;
        }

        .tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        /* Контент */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* Список репозиториев */
        .repo-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .repo-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .repo-card:active {
            transform: scale(0.97);
            border-color: var(--accent);
        }

        .repo-card h3 {
            font-size: 16px;
            margin-bottom: 6px;
            color: var(--accent);
        }

        .repo-card p {
            font-size: 13px;
            color: var(--muted);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
        }

        .modal h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .input:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea.input {
            resize: vertical;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        /* Редактор репозитория */
        .editor-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .editor-header h2 {
            flex: 1;
            font-size: 18px;
            min-width: 100px;
        }

        .code-editor {
            width: 100%;
            min-height: 200px;
            background: #0a0e14;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 12px;
            margin-bottom: 12px;
            resize: vertical;
            line-height: 1.5;
            tab-size: 4;
        }

        .code-editor:focus {
            outline: none;
            border-color: var(--accent);
        }

        .file-list {
            margin: 10px 0;
        }

        .file-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            transition: all 0.2s;
            flex-wrap: wrap;
        }

        .file-item:active {
            border-color: var(--accent);
        }

        .file-item .file-icon {
            font-size: 16px;
        }

        .file-item .file-name {
            flex: 1;
            min-width: 80px;
        }

        /* Preview */
        .preview-frame {
            width: 100%;
            height: 100%;
            min-height: 400px;
            background: white;
            border: none;
            border-radius: 8px;
        }

        .preview-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        /* Toast уведомления */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            z-index: 200;
            white-space: nowrap;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast.show {
            display: block;
            animation: toastIn 0.3s;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Кнопка удаления файла */
        .delete-file-btn {
            background: transparent;
            border: none;
            color: var(--red);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <div class="logo">
            <span class="logo-icon">📦</span>
            <h1>ChugurHub</h1>
        </div>
        <button class="btn btn-primary" onclick="showCreateRepoModal()">+ Новый</button>
    </div>

    <!-- Вкладки -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('repos')">📁 Репозитории</div>
        <div class="tab" onclick="switchTab('pages')">🌐 Pages</div>
    </div>

    <!-- Контент -->
    <div class="content" id="content">
        <!-- Здесь будет динамический контент -->
    </div>

    <!-- Модальное окно создания репозитория -->
    <div class="modal-overlay" id="createRepoModal">
        <div class="modal">
            <h2>Создать новый репозиторий</h2>
            <input type="text" class="input" id="repoNameInput" placeholder="Название репозитория" />
            <textarea class="input" id="repoDescInput" placeholder="Описание (необязательно)" rows="3"></textarea>
            <div class="modal-buttons">
                <button class="btn" onclick="closeModal('createRepoModal')">Отмена</button>
                <button class="btn btn-primary" onclick="createRepo()">Создать</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания файла -->
    <div class="modal-overlay" id="createFileModal">
        <div class="modal">
            <h2>Создать новый файл</h2>
            <input type="text" class="input" id="fileNameInput" placeholder="Название файла (например, index.html)" />
            <div class="modal-buttons">
                <button class="btn" onclick="closeModal('createFileModal')">Отмена</button>
                <button class="btn btn-primary" onclick="createFile()">Создать</button>
            </div>
        </div>
    </div>

    <!-- Уведомление -->
    <div class="toast" id="toast"></div>

    <script>
        // ============ ДАННЫЕ ============
        let repos = [];
        let currentRepo = null;
        let currentFile = null;
        let currentTab = 'repos';

        // Загрузка данных из localStorage
        function loadData() {
            const saved = localStorage.getItem('chugurhub_repos');
            if (saved) {
                try {
                    repos = JSON.parse(saved);
                } catch(e) {
                    repos = [];
                }
            }
            
            // Если нет репозиториев, создаём демо
            if (repos.length === 0) {
                repos.push({
                    id: generateId(),
                    name: 'my-first-repo',
                    description: 'Демо репозиторий',
                    files: [
                        {
                            id: generateId(),
                            name: 'index.html',
                            content: '<!DOCTYPE html>\n<html>\n<head>\n    <title>Мой сайт</title>\n    <style>\n        body {\n            font-family: Arial;\n            text-align: center;\n            padding: 50px;\n            background: #f0f0f0;\n        }\n        h1 { color: #333; }\n    </style>\n</head>\n<body>\n    <h1>Привет, ChugurHub!</h1>\n    <p>Это мой первый сайт</p>\n</body>\n</html>'
                        }
                    ]
                });
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('chugurhub_repos', JSON.stringify(repos));
        }

        function generateId() {
            return Date.now() + Math.random().toString(36).substr(2, 9);
        }

        // ============ НАВИГАЦИЯ ============
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (tab === 'repos') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                renderReposList();
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                renderPagesList();
            }
        }

        // ============ ОТОБРАЖЕНИЕ ============
        function renderReposList() {
            const content = document.getElementById('content');
            if (repos.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📦</div>
                        <h3>Нет репозиториев</h3>
                        <p>Создайте свой первый репозиторий!</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="repo-list">';
            repos.forEach(repo => {
                const fileCount = repo.files ? repo.files.length : 0;
                html += `
                    <div class="repo-card" onclick="openRepo('${repo.id}')">
                        <h3>📁 ${repo.name}</h3>
                        <p>${repo.description || 'Нет описания'} • ${fileCount} файл(ов)</p>
                    </div>
                `;
            });
            html += '</div>';
            content.innerHTML = html;
        }

        function renderPagesList() {
            const content = document.getElementById('content');
            const pagesRepos = repos.filter(repo => 
                repo.files && repo.files.some(f => f.name === 'index.html' && f.content.trim() !== '')
            );

            if (pagesRepos.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🌐</div>
                        <h3>Нет доступных страниц</h3>
                        <p>Создайте репозиторий с файлом index.html, чтобы он появился здесь</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="repo-list">';
            pagesRepos.forEach(repo => {
                html += `
                    <div class="repo-card" onclick="openPage('${repo.id}')">
                        <h3>🌐 ${repo.name}</h3>
                        <p>Открыть страницу</p>
                    </div>
                `;
            });
            html += '</div>';
            content.innerHTML = html;
        }

        function openRepo(repoId) {
            currentRepo = repos.find(r => r.id === repoId);
            if (!currentRepo) return;
            renderRepoEditor();
        }

        function renderRepoEditor() {
            const content = document.getElementById('content');
            let html = `
                <div class="editor-header">
                    <button class="btn" onclick="switchTab('repos')">← Назад</button>
                    <h2>📁 ${currentRepo.name}</h2>
                    <button class="btn btn-primary" onclick="showCreateFileModal()">+ Файл</button>
                </div>
                <div class="file-list">
            `;

            if (currentRepo.files && currentRepo.files.length > 0) {
                currentRepo.files.forEach(file => {
                    const icon = getFileIcon(file.name);
                    html += `
                        <div class="file-item">
                            <span class="file-icon">${icon}</span>
                            <span class="file-name">${file.name}</span>
                            <button class="btn" onclick="event.stopPropagation(); openFile('${file.id}')">Открыть</button>
                            <button class="btn btn-danger" onclick="event.stopPropagation(); deleteFile('${file.id}')">🗑</button>
                        </div>
                    `;
                });
            } else {
                html += '<p style="color: var(--muted); text-align: center; padding: 20px;">Нет файлов. Создайте первый файл!</p>';
            }

            html += '</div>';
            content.innerHTML = html;
        }

        function openFile(fileId) {
            currentFile = currentRepo.files.find(f => f.id === fileId);
            if (!currentFile) return;
            renderFileEditor();
        }

        function renderFileEditor() {
            const content = document.getElementById('content');
            const isHtml = currentFile.name.endsWith('.html') || currentFile.name.endsWith('.htm');
            
            content.innerHTML = `
                <div class="editor-header">
                    <button class="btn" onclick="renderRepoEditor()">← Назад</button>
                    <h2>${getFileIcon(currentFile.name)} ${currentFile.name}</h2>
                    <button class="btn btn-primary" onclick="saveCurrentFile()">💾 Сохранить</button>
                    ${isHtml ? '<button class="btn btn-accent" onclick="previewFile()">👁 Просмотр</button>' : ''}
                </div>
                <textarea class="code-editor" id="fileContent" spellcheck="false">${escapeHtml(currentFile.content)}</textarea>
            `;

            // Автосохранение
            const textarea = document.getElementById('fileContent');
            textarea.addEventListener('input', function() {
                currentFile.content = this.value;
                saveData();
            });
        }

        function openPage(repoId) {
            const repo = repos.find(r => r.id === repoId);
            if (!repo) return;
            
            const indexFile = repo.files.find(f => f.name === 'index.html');
            if (!indexFile || !indexFile.content.trim()) {
                showToast('Файл index.html пуст');
                return;
            }

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="editor-header">
                    <button class="btn" onclick="switchTab('pages')">← Назад</button>
                    <h2>🌐 ${repo.name}</h2>
                    <button class="btn btn-accent" onclick="openInNewTab()">↗ Открыть</button>
                </div>
                <iframe class="preview-frame" id="previewFrame" srcdoc="${escapeHtml(indexFile.content)}"></iframe>
            `;
        }

        function openInNewTab() {
            const repo = currentRepo;
            if (!repo) return;
            const indexFile = repo.files.find(f => f.name === 'index.html');
            if (indexFile) {
                const blob = new Blob([indexFile.content], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
            }
        }

        function previewFile() {
            if (!currentFile) return;
            const content = document.getElementById('fileContent').value;
            const blob = new Blob([content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        // ============ CRUD ОПЕРАЦИИ ============
        function showCreateRepoModal() {
            document.getElementById('createRepoModal').classList.add('show');
            document.getElementById('repoNameInput').value = '';
            document.getElementById('repoDescInput').value = '';
            document.getElementById('repoNameInput').focus();
        }

        function createRepo() {
            const name = document.getElementById('repoNameInput').value.trim();
            const description = document.getElementById('repoDescInput').value.trim();
            
            if (!name) {
                showToast('Введите название репозитория');
                return;
            }

            const repo = {
                id: generateId(),
                name: name,
                description: description,
                files: []
            };

            repos.push(repo);
            saveData();
            closeModal('createRepoModal');
            renderReposList();
            showToast('Репозиторий создан: ' + name);
        }

        function showCreateFileModal() {
            document.getElementById('createFileModal').classList.add('show');
            document.getElementById('fileNameInput').value = '';
            document.getElementById('fileNameInput').focus();
        }

        function createFile() {
            const name = document.getElementById('fileNameInput').value.trim();
            
            if (!name) {
                showToast('Введите название файла');
                return;
            }

            const file = {
                id: generateId(),
                name: name,
                content: name.endsWith('.html') ? '<!DOCTYPE html>\n<html>\n<head>\n    <title>Новая страница</title>\n</head>\n<body>\n    \n</body>\n</html>' : ''
            };

            currentRepo.files.push(file);
            saveData();
            closeModal('createFileModal');
            renderRepoEditor();
            showToast('Файл создан: ' + name);
        }

        function deleteFile(fileId) {
            if (confirm('Удалить этот файл?')) {
                currentRepo.files = currentRepo.files.filter(f => f.id !== fileId);
                saveData();
                renderRepoEditor();
                showToast('Файл удалён');
            }
        }

        function saveCurrentFile() {
            const textarea = document.getElementById('fileContent');
            if (textarea && currentFile) {
                currentFile.content = textarea.value;
                saveData();
                showToast('Файл сохранён');
            }
        }

        // ============ УТИЛИТЫ ============
        function getFileIcon(name) {
            if (name.endsWith('.html') || name.endsWith('.htm')) return '🌐';
            if (name.endsWith('.css')) return '🎨';
            if (name.endsWith('.js')) return '⚡';
            if (name.endsWith('.json')) return '📋';
            if (name.endsWith('.md')) return '📝';
            if (name.endsWith('.py')) return '🐍';
            if (name.endsWith('.txt')) return '📄';
            return '📄';
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // Закрытие модальных окон при клике вне
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                }
            });
        });

        // Инициализация
        loadData();
        renderReposList();
    </script>
</body>
  </html>
