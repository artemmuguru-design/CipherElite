<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RNG Legends</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 20%, #26356b 0%, #10142d 35%, #070912 75%);
    overflow-x: hidden;
}

button {
    font: inherit;
}

.app {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 14px;
    margin-bottom: 15px;

    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span {
    color: #8b7cff;
}

.money {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 13px;
    border-radius: 14px;
    background: rgba(255,255,255,.08);
    font-weight: bold;
}

.coin {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: linear-gradient(135deg,#fff36a,#ffb300);
    color: #8a4b00;
    font-size: 12px;
}

/* MAIN */

.arena {
    position: relative;
    min-height: 430px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 25px;

    border-radius: 28px;
    background:
        radial-gradient(circle at 50% 45%, rgba(100,100,255,.18), transparent 45%),
        rgba(255,255,255,.045);

    border: 1px solid rgba(255,255,255,.1);
    box-shadow: inset 0 0 70px rgba(0,0,0,.2);
}

.title {
    margin: 0 0 6px;
    font-size: 30px;
    font-weight: 900;
    text-align: center;
}

.subtitle {
    margin: 0 0 25px;
    color: #9da5c8;
    text-align: center;
}

/* ORB */

.orb {
    width: 180px;
    height: 180px;
    position: relative;
    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        radial-gradient(circle at 35% 30%, white 0%, #a99cff 8%, #6255ff 28%, #201c72 65%, #090a25 100%);

    box-shadow:
        0 0 25px #7165ff,
        0 0 70px rgba(113,101,255,.55),
        inset 0 0 30px rgba(255,255,255,.4);

    cursor: pointer;
    transition: transform .2s;
}

.orb::before {
    content: "";
    position: absolute;
    inset: -13px;
    border-radius: 50%;
    border: 2px solid rgba(160,150,255,.35);
    animation: rotate 5s linear infinite;
}

.orb::after {
    content: "";
    position: absolute;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    border: 1px dashed rgba(255,255,255,.12);
    animation: rotateReverse 9s linear infinite;
}

.orb:hover {
    transform: scale(1.04);
}

.orb:active {
    transform: scale(.94);
}

.orb-icon {
    font-size: 65px;
    filter: drop-shadow(0 0 15px white);
    z-index: 2;
}

@keyframes rotate {
    from { transform: rotate(0); }
    to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0); }
}

.orb.shake {
    animation: shake .12s infinite;
}

@keyframes shake {
    0% { transform: translate(0,0) scale(1); }
    25% { transform: translate(5px,-4px) scale(1.03); }
    50% { transform: translate(-5px,3px) scale(.98); }
    75% { transform: translate(3px,5px) scale(1.03); }
    100% { transform: translate(0,0) scale(1); }
}

/* BUTTONS */

.buttons {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 550px;
    margin-top: 35px;
}

.btn {
    flex: 1;
    border: 0;
    padding: 16px;
    border-radius: 17px;
    color: white;
    font-weight: 900;
    cursor: pointer;
    transition: .2s;
}

.btn:hover {
    transform: translateY(-2px);
}

.btn:active {
    transform: scale(.96);
}

.summon {
    background: linear-gradient(135deg,#7165ff,#9a55ff);
    box-shadow: 0 10px 30px rgba(113,101,255,.35);
}

.ten {
    background: linear-gradient(135deg,#ff5964,#ff8a5c);
    box-shadow: 0 10px 30px rgba(255,89,100,.25);
}

/* RESULT */

.result {
    position: fixed;
    inset: 0;
    z-index: 50;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(2,3,12,.78);
    backdrop-filter: blur(12px);
}

.result.show {
    display: flex;
}

.result-card {
    width: min(420px,100%);
    padding: 30px;
    text-align: center;

    border-radius: 30px;

    background:
        linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));

    border: 1px solid rgba(255,255,255,.18);

    box-shadow: 0 30px 100px rgba(0,0,0,.5);

    animation: appear .45s cubic-bezier(.2,.9,.2,1);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.6) translateY(30px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.character {
    font-size: 100px;
    margin: 15px;
    filter: drop-shadow(0 0 25px currentColor);
}

.character-name {
    font-size: 30px;
    font-weight: 900;
}

.rarity {
    display: inline-block;
    margin: 10px 0 20px;
    padding: 7px 15px;
    border-radius: 20px;
    font-weight: 900;
}

.description {
    color: #aeb5d2;
    line-height: 1.5;
    margin-bottom: 22px;
}

.close {
    width: 100%;
    border: 0;
    padding: 14px;
    border-radius: 15px;
    background: white;
    color: #11152b;
    font-weight: 900;
    cursor: pointer;
}

/* COLLECTION */

.section {
    margin-top: 18px;
    padding: 18px;

    border-radius: 24px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.section-title h2 {
    margin: 0;
    font-size: 20px;
}

.count {
    color: #8f96b8;
    font-size: 14px;
}

.collection {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(115px,1fr));
    gap: 10px;
}

.card {
    position: relative;
    min-height: 145px;
    padding: 13px;

    border-radius: 18px;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);

    text-align: center;
    overflow: hidden;
    transition: .2s;
}

.card:hover {
    transform: translateY(-3px);
}

.card.locked {
    filter: grayscale(1);
    opacity: .45;
}

.card-icon {
    font-size: 48px;
    margin: 8px;
}

.card-name {
    font-size: 13px;
    font-weight: bold;
}

.card-rarity {
    margin-top: 5px;
    font-size: 11px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}

.stat {
    padding: 15px;
    border-radius: 17px;
    background: rgba(255,255,255,.055);
    text-align: center;
}

.stat-number {
    font-size: 24px;
    font-weight: 900;
}

.stat-label {
    margin-top: 4px;
    color: #8d95b5;
    font-size: 12px;
}

/* CHANCES */

.chances {
    display: grid;
    gap: 8px;
}

.chance {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 13px;
    border-radius: 12px;
    background: rgba(255,255,255,.045);
}

.chance-name {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
}

.common { color:#b8becb; }
.rare { color:#4ca5ff; }
.epic { color:#bd62ff; }
.legendary { color:#ffc247; }
.mythic { color:#ff4d76; }

.common .dot { background:#b8becb; }
.rare .dot { background:#4ca5ff; }
.epic .dot { background:#bd62ff; }
.legendary .dot { background:#ffc247; }
.mythic .dot { background:#ff4d76; }

/* PARTICLES */

.particle {
    position: fixed;
    pointer-events: none;
    z-index: 100;

    width: 8px;
    height: 8px;
    border-radius: 50%;

    animation: particle 1s ease-out forwards;
}

@keyframes particle {
    from {
        opacity: 1;
        transform: translate(0,0) scale(1);
    }
    to {
        opacity: 0;
        transform:
            translate(
                calc((var(--x) - .5) * 500px),
                calc((var(--y) - .5) * 500px)
            )
            scale(0);
    }
}

/* MOBILE */

@media(max-width:600px) {
    .app {
        padding: 10px;
    }

    .arena {
        min-height: 440px;
        padding: 18px;
    }

    .title {
        font-size: 26px;
    }

    .orb {
        width: 155px;
        height: 155px;
    }

    .orb-icon {
        font-size: 55px;
    }

    .buttons {
        flex-direction: column;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .collection {
        grid-template-columns: repeat(3,1fr);
    }
}

@media(max-width:360px) {
    .collection {
        grid-template-columns: repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">
            RNG <span>LEGENDS</span>
        </div>

        <div class="money">
            <div class="coin">★</div>
            <span id="coins">1000</span>
        </div>
    </header>


    <main class="arena">

        <h1 class="title">⚡ Призови героя</h1>
        <p class="subtitle">Испытай удачу и собери всех персонажей</p>

        <div class="orb" id="orb" onclick="summon(1)">
            <div class="orb-icon">❓</div>
        </div>

        <div class="buttons">
            <button class="btn summon" onclick="summon(1)">
                🎲 ПРИЗВАТЬ · 100
            </button>

            <button class="btn ten" onclick="summon(10)">
                🔥 ×10 · 900
            </button>
        </div>

    </main>


    <section class="section">

        <div class="section-title">
            <h2>📊 Статистика</h2>
        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-number" id="total">0</div>
                <div class="stat-label">Призывов</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="best">—</div>
                <div class="stat-label">Лучшая редкость</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="owned">0/15</div>
                <div class="stat-label">Персонажей</div>
            </div>

        </div>
    </section>


    <section class="section">

        <div class="section-title">
            <h2>🎯 Шансы</h2>
        </div>

        <div class="chances">

            <div class="chance common">
                <div class="chance-name">
                    <span class="dot"></span>
                    Обычный
                </div>
                <b>60%</b>
            </div>

            <div class="chance rare">
                <div class="chance-name">
                    <span class="dot"></span>
                    Редкий
                </div>
                <b>25%</b>
            </div>

            <div class="chance epic">
                <div class="chance-name">
                    <span class="dot"></span>
                    Эпический
                </div>
                <b>10%</b>
            </div>

            <div class="chance legendary">
                <div class="chance-name">
                    <span class="dot"></span>
                    Легендарный
                </div>
                <b>4%</b>
            </div>

            <div class="chance mythic">
                <div class="chance-name">
                    <span class="dot"></span>
                    Мифический
                </div>
                <b>1%</b>
            </div>

        </div>
    </section>


    <section class="section">

        <div class="section-title">
            <h2>📖 Коллекция</h2>
            <span class="count" id="collectionCount">0/15</span>
        </div>

        <div class="collection" id="collection"></div>

    </section>

</div>


<!-- RESULT -->

<div class="result" id="result">

    <div class="result-card">

        <div id="resultIcon" class="character">❓</div>

        <div id="resultName" class="character-name">
            Герой
        </div>

        <div id="resultRarity" class="rarity">
            Редкость
        </div>

        <div id="resultDescription" class="description">
            Описание героя
        </div>

        <button class="close" onclick="closeResult()">
            ПРОДОЛЖИТЬ
        </button>

    </div>

</div>


<script>

/* =========================
   ПЕРСОНАЖИ
========================= */

const characters = [

    {
        id: 1,
        name: "Новичок",
        icon: "🧑",
        rarity: "Обычный",
        class: "common",
        chance: 30,
        description: "Первый герой каждого путешественника."
    },

    {
        id: 2,
        name: "Лучник",
        icon: "🏹",
        rarity: "Обычный",
        class: "common",
        chance: 30,
        description: "Меткий стрелок, который никогда не промахивается."
    },

    {
        id: 3,
        name: "Рыцарь",
        icon: "🛡️",
        rarity: "Редкий",
        class: "rare",
        chance: 12,
        description: "Защитник королевства в сияющих доспехах."
    },

    {
        id: 4,
        name: "Маг",
        icon: "🧙",
        rarity: "Редкий",
        class: "rare",
        chance: 13,
        description: "Повелитель древней магии."
    },

    {
        id: 5,
        name: "Самурай",
        icon: "🥷",
        rarity: "Эпический",
        class: "epic",
        chance: 5,
        description: "Мастер меча, способный победить одним ударом."
    },

    {
        id: 6,
        name: "Вампир",
        icon: "🧛",
        rarity: "Эпический",
        class: "epic",
        chance: 5,
        description: "Таинственный бессмертный охотник."
    },

    {
        id: 7,
        name: "Дракон",
        icon: "🐉",
        rarity: "Легендарный",
        class: "legendary",
        chance: 1.5,
        description: "Древнее существо, способное уничтожить целую армию."
    },

    {
        id: 8,
        name: "Повелитель",
        icon: "👑",
        rarity: "Легендарный",
        class: "legendary",
        chance: 1.5,
        description: "Легендарный правитель потерянного мира."
    },

    {
        id: 9,
        name: "Космический Бог",
        icon: "🌌",
        rarity: "Мифический",
        class: "mythic",
        chance: 0.5,
        description: "Существо за пределами пространства и времени."
    },

    {
        id: 10,
        name: "Тёмный Бог",
        icon: "☠️",
        rarity: "Мифический",
        class: "mythic",
        chance: 0.5,
        description: "Один из самых редких персонажей вселенной."
    },

    {
        id: 11,
        name: "Пират",
        icon: "🏴‍☠️",
        rarity: "Обычный",
        class: "common",
        chance: 0
    },

    {
        id: 12,
        name: "Алхимик",
        icon: "⚗️",
        rarity: "Редкий",
        class: "rare",
        chance: 0
    },

    {
        id: 13,
        name: "Демон",
        icon: "👹",
        rarity: "Эпический",
        class: "epic",
        chance: 0
    },

    {
        id: 14,
        name: "Феникс",
        icon: "🔥",
        rarity: "Легендарный",
        class: "legendary",
        chance: 0
    },

    {
        id: 15,
        name: "???",
        icon: "👁️",
        rarity: "Мифический",
        class: "mythic",
        chance: 0
    }

];


/* =========================
   СОСТОЯНИЕ
========================= */

let game = JSON.parse(localStorage.getItem("rngLegends")) || {

    coins: 1000,
    total: 0,
    owned: [],
    best: 0

};


/* =========================
   СОХРАНЕНИЕ
========================= */

function save() {

    localStorage.setItem(
        "rngLegends",
        JSON.stringify(game)
    );

}


/* =========================
   ОБНОВЛЕНИЕ UI
========================= */

function updateUI() {

    document.getElementById("coins").textContent =
        game.coins.toLocaleString();

    document.getElementById("total").textContent =
        game.total;

    document.getElementById("owned").textContent =
        `${game.owned.length}/${characters.length}`;

    document.getElementById("collectionCount").textContent =
        `${game.owned.length}/${characters.length}`;

    let best = ["—","Обычный","Редкий","Эпический","Легендарный","Мифический"];

    document.getElementById("best").textContent =
        best[game.best];

    renderCollection();

    save();

}


/* =========================
   КОЛЛЕКЦИЯ
========================= */

function renderCollection() {

    const container =
        document.getElementById("collection");

    container.innerHTML = "";

    characters.forEach(character => {

        const unlocked =
            game.owned.includes(character.id);

        const card =
            document.createElement("div");

        card.className =
            "card " + (!unlocked ? "locked" : "");

        card.innerHTML = `

            <div class="card-icon">
                ${unlocked ? character.icon : "❔"}
            </div>

            <div class="card-name">
                ${unlocked ? character.name : "Неизвестно"}
            </div>

            <div class="card-rarity ${character.class}">
                ${unlocked ? character.rarity : "???"}
            </div>

        `;

        container.appendChild(card);

    });

}


/* =========================
   RNG
========================= */

function randomCharacter() {

    const active =
        characters.filter(c => c.chance > 0);

    const totalChance =
        active.reduce((sum,c) => sum + c.chance,0);

    let random =
        Math.random() * totalChance;

    for(const character of active) {

        random -= character.chance;

        if(random <= 0) {
            return character;
        }

    }

    return active[active.length - 1];

}


/* =========================
   ПРИЗЫВ
========================= */

function summon(amount) {

    const price =
        amount === 10 ? 900 : 100;

    if(game.coins < price) {

        alert("Недостаточно монет!");

        return;

    }

    game.coins -= price;

    if(amount === 1) {

        game.total++;

        const character =
            randomCharacter();

        registerCharacter(character);

        animateOrb(() => {
            showResult(character);
        });

    } else {

        let results = [];

        for(let i=0;i<10;i++) {

            game.total++;

            const character =
                randomCharacter();

            registerCharacter(character);

            results.push(character);

        }

        const best =
            getBestCharacter(results);

        animateOrb(() => {
            showResult(best, true, results);
        });

    }

    updateUI();

}


/* =========================
   РЕГИСТРАЦИЯ
========================= */

function registerCharacter(character) {

    if(!game.owned.includes(character.id)) {

        game.owned.push(character.id);

    }

    const rank =
        getRank(character.rarity);

    if(rank > game.best) {

        game.best = rank;

    }

}


/* =========================
   РАНГ РЕДКОСТИ
========================= */

function getRank(rarity) {

    if(rarity === "Обычный") return 1;
    if(rarity === "Редкий") return 2;
    if(rarity === "Эпический") return 3;
    if(rarity === "Легендарный") return 4;
    if(rarity === "Мифический") return 5;

    return 0;

}


/* =========================
   ЛУЧШИЙ
========================= */

function getBestCharacter(list) {

    return list.reduce(
        (best,current) => {

            return getRank(current.rarity) >
                   getRank(best.rarity)
                ? current
                : best;

        }
    );

}


/* =========================
   АНИМАЦИЯ
========================= */

function animateOrb(callback) {

    const orb =
        document.getElementById("orb");

    orb.classList.add("shake");

    createParticles();

    setTimeout(() => {

        orb.classList.remove("shake");

        callback();

    },900);

}


/* =========================
   РЕЗУЛЬТАТ
========================= */

function showResult(character, multiple=false, results=[]) {

    document.getElementById("resultIcon")
        .textContent = character.icon;

    document.getElementById("resultName")
        .textContent =
        multiple
        ? `Лучший из 10: ${character.name}`
        : character.name;

    const rarity =
        document.getElementById("resultRarity");

    rarity.textContent =
        character.rarity;

    rarity.className =
        "rarity " + character.class;

    document.getElementById("resultDescription")
        .textContent =
        multiple
        ? `Ты получил 10 персонажей! Лучший результат — ${character.rarity}.`
        : character.description;

    document.getElementById("result")
        .classList.add("show");

}


/* =========================
   ЗАКРЫТЬ
========================= */

function closeResult() {

    document.getElementById("result")
        .classList.remove("show");

    updateUI();

}


/* =========================
   ЧАСТИЦЫ
========================= */

function createParticles() {

    for(let i=0;i<45;i++) {

        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.style.left =
            "50%";

        particle.style.top =
            "50%";

        particle.style.setProperty(
            "--x",
            Math.random()
        );

        particle.style.setProperty(
            "--y",
            Math.random()
        );

        particle.style.animationDelay =
            Math.random() * .2 + "s";

        document.body.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        },1200);

    }

}


/* =========================
   ЗАПУСК
========================= */

updateUI();

</script>
