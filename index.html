<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AI 3D Generator</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070810;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

header{
    height:64px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    padding:0 18px;
    background:#0c0e18;
    border-bottom:1px solid #202334;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.logo b{
    color:#8b5cf6;
}

.main{
    flex:1;
    min-height:0;
    display:flex;
}

.panel{
    width:320px;
    flex-shrink:0;
    background:#0c0e17;
    border-right:1px solid #202334;
    padding:22px;
    overflow:auto;
}

h1{
    margin:0 0 8px;
    font-size:28px;
}

.desc{
    color:#888da0;
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}

label{
    display:block;
    color:#aeb2c1;
    font-size:13px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    outline:none;
    border:1px solid #292d40;
    background:#151824;
    color:white;
    font-size:16px;
}

input:focus{
    border-color:#8b5cf6;
}

.generate{
    width:100%;
    margin-top:10px;
    padding:15px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    cursor:pointer;
}

.generate:active{
    transform:scale(.98);
}

.examples{
    margin-top:22px;
}

.examples-title{
    color:#777c90;
    font-size:11px;
    margin-bottom:9px;
}

.chips{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.chip{
    padding:8px 11px;
    border:1px solid #292d40;
    border-radius:20px;
    color:#c7cad4;
    background:#151824;
    font-size:12px;
    cursor:pointer;
}

.status{
    margin-top:20px;
    padding:13px;
    border-radius:12px;
    background:#11141f;
    border:1px solid #222638;
    color:#8e93a6;
    font-size:12px;
    line-height:1.5;
}

.viewer{
    position:relative;
    flex:1;
    min-width:0;
    min-height:0;
    background:
        radial-gradient(circle at 50% 45%,#17152b 0%,#090a10 42%,#070810 100%);
}

canvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

.model-title{
    position:absolute;
    top:15px;
    left:15px;
    z-index:5;
    padding:9px 13px;
    border-radius:10px;
    background:rgba(15,17,27,.8);
    border:1px solid #292d40;
    font-size:13px;
    pointer-events:none;
}

.buttons{
    position:absolute;
    bottom:18px;
    left:15px;
    right:15px;
    z-index:5;
    display:flex;
    justify-content:center;
    gap:8px;
}

button{
    font-family:inherit;
}

.action{
    padding:13px 17px;
    border-radius:11px;
    border:1px solid #303447;
    background:rgba(14,16,25,.9);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.download{
    background:white;
    color:#08090e;
    border-color:white;
}

.loading{
    position:absolute;
    inset:0;
    z-index:10;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(5,6,10,.65);
    backdrop-filter:blur(7px);
}

.loading.show{
    display:flex;
}

.loader{
    text-align:center;
    background:#11131d;
    border:1px solid #2a2e40;
    border-radius:16px;
    padding:24px 30px;
}

.spinner{
    width:35px;
    height:35px;
    margin:auto auto 13px;
    border:3px solid #303448;
    border-top-color:#9b6cff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.error{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    display:none;
    max-width:90%;
    padding:12px 15px;
    border-radius:10px;
    background:#32151a;
    border:1px solid #6d2933;
    color:#ffb4bd;
    font-size:12px;
}

@media(max-width:700px){

    header{
        height:54px;
    }

    .main{
        flex-direction:column;
    }

    .panel{
        width:100%;
        height:42%;
        border-right:0;
        border-bottom:1px solid #202334;
        padding:15px;
    }

    h1{
        font-size:23px;
    }

    .desc{
        margin-bottom:12px;
    }

    .examples{
        margin-top:13px;
    }

    .viewer{
        height:58%;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">Text<b>3D</b></div>
</header>

<div class="main">

<div class="panel">

    <h1>Создай 3D</h1>

    <div class="desc">
        Напиши название объекта. Например:
        <b>стул</b>, <b>машина</b> или <b>дом</b>.
    </div>

    <label>Что создать?</label>

    <input
        id="prompt"
        value="стул"
        placeholder="Например: стул"
        autocomplete="off"
    >

    <button class="generate" id="generateBtn">
        ✨ СОЗДАТЬ 3D
    </button>

    <div class="examples">

        <div class="examples-title">
            БЫСТРЫЕ ПРИМЕРЫ
        </div>

        <div class="chips">
            <div class="chip" data-name="стул">🪑 Стул</div>
            <div class="chip" data-name="стол">Стол</div>
            <div class="chip" data-name="машина">🚗 Машина</div>
            <div class="chip" data-name="дом">🏠 Дом</div>
            <div class="chip" data-name="дерево">🌳 Дерево</div>
            <div class="chip" data-name="лампа">💡 Лампа</div>
            <div class="chip" data-name="меч">⚔️ Меч</div>
            <div class="chip" data-name="робот">🤖 Робот</div>
            <div class="chip" data-name="бутылка">Бутылка</div>
            <div class="chip" data-name="куб">Куб</div>
        </div>

    </div>

    <div class="status" id="status">
        Готово. Напиши объект и нажми «Создать 3D».
    </div>

</div>

<div class="viewer">

    <div class="model-title" id="modelTitle">
        3D Preview
    </div>

    <div class="error" id="error"></div>

    <canvas id="canvas"></canvas>

    <div class="buttons">

        <button class="action" id="resetBtn">
            ⟳ Сбросить
        </button>

        <button class="action" id="leftBtn">
            ↶
        </button>

        <button class="action" id="rightBtn">
            ↷
        </button>

        <button class="action download" id="downloadBtn">
            ⬇ Скачать GLB
        </button>

    </div>

    <div class="loading" id="loading">

        <div class="loader">

            <div class="spinner"></div>

            <div>
                Создаём модель...
            </div>

        </div>

    </div>

</div>

</div>
</div>


<script type="module">

/* =====================================================
   IMPORT THREE.JS
===================================================== */

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

import { GLTFExporter } from
'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/exporters/GLTFExporter.js';


/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
document.getElementById("canvas");

const promptInput =
document.getElementById("prompt");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const status =
document.getElementById("status");

const modelTitle =
document.getElementById("modelTitle");


/* =====================================================
   THREE
===================================================== */

let scene;

let camera;

let renderer;

let currentModel = null;

let rotationY = 0;

let rotationX = 0;

let distance = 6;

let dragging = false;

let lastX = 0;

let lastY = 0;


/* =====================================================
   INIT
===================================================== */

function init(){

    scene =
    new THREE.Scene();

    scene.background =
    new THREE.Color(0x08090f);


    camera =
    new THREE.PerspectiveCamera(
        45,
        1,
        0.1,
        100
    );


    camera.position.set(
        0,
        1,
        distance
    );


    renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias:true,
        alpha:false,
        preserveDrawingBuffer:true
    });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );


    renderer.outputColorSpace =
    THREE.SRGBColorSpace;


    /* LIGHT */

    const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x222233,
        2.5
    );

    scene.add(hemi);


    const light =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );

    light.position.set(
        4,
        7,
        6
    );

    scene.add(light);


    const light2 =
    new THREE.DirectionalLight(
        0x7777ff,
        2
    );

    light2.position.set(
        -5,
        3,
        -4
    );

    scene.add(light2);


    /* FLOOR */

    const floor =
    new THREE.Mesh(
        new THREE.CircleGeometry(
            5,
            64
        ),
        new THREE.MeshStandardMaterial({
            color:0x10121b,
            roughness:.9
        })
    );

    floor.rotation.x =
    -Math.PI / 2;

    floor.position.y =
    -1.6;

    scene.add(floor);


    resize();


    window.addEventListener(
        "resize",
        resize
    );


    setupControls();


    animate();


    createModel("стул");
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    const width =
    canvas.clientWidth;

    const height =
    canvas.clientHeight;


    if(width <= 0 || height <= 0)
        return;


    camera.aspect =
    width / height;

    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height,
        false
    );
}


/* =====================================================
   MATERIAL
===================================================== */

function mat(color){

    return new THREE.MeshStandardMaterial({

        color,

        roughness:.55,

        metalness:.08

    });
}


/* =====================================================
   CUBE
===================================================== */

function box(
    x,y,z,
    sx,sy,sz,
    color
){

    const mesh =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            sx,sy,sz
        ),

        mat(color)

    );

    mesh.position.set(
        x,y,z
    );

    return mesh;
}


/* =====================================================
   CYLINDER
===================================================== */

function cyl(
    x,y,z,
    r,h,
    color
){

    const mesh =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            r,r,h,32
        ),

        mat(color)

    );

    mesh.position.set(
        x,y,z
    );

    return mesh;
}


/* =====================================================
   SPHERE
===================================================== */

function ball(
    x,y,z,
    r,
    color
){

    const mesh =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            r,
            32,
            20
        ),

        mat(color)

    );

    mesh.position.set(
        x,y,z
    );

    return mesh;
}


/* =====================================================
   CHAIR
===================================================== */

function chair(){

    const g =
    new THREE.Group();

    const wood =
    0x9b6038;


    /* seat */

    g.add(
        box(
            0,
            0.45,
            0,
            2.5,
            .35,
            2.5,
            wood
        )
    );


    /* legs */

    [
        [-.9,-.6,-.9],
        [.9,-.6,-.9],
        [-.9,-.6,.9],
        [.9,-.6,.9]

    ].forEach(p=>{

        g.add(
            box(
                p[0],
                p[1],
                p[2],
                .3,
                2.1,
                .3,
                wood
            )
        );

    });


    /* back */

    g.add(
        box(
            0,
            1.65,
            .98,
            2.5,
            2.2,
            .28,
            wood
        )
    );


    return g;
}


/* =====================================================
   TABLE
===================================================== */

function table(){

    const g =
    new THREE.Group();

    const wood =
    0x8d5b39;


    g.add(
        box(
            0,
            1.2,
            0,
            4.2,
            .35,
            2.5,
            wood
        )
    );


    [
        [-1.6,0,-.8],
        [1.6,0,-.8],
        [-1.6,0,.8],
        [1.6,0,.8]

    ].forEach(p=>{

        g.add(
            box(
                p[0],
                p[1],
                p[2],
                .35,
                2.4,
                .35,
                wood
            )
        );

    });


    return g;
}


/* =====================================================
   HOUSE
===================================================== */

function house(){

    const g =
    new THREE.Group();


    g.add(
        box(
            0,
            0,
            0,
            4,
            3,
            3.3,
            0xd19a64
        )
    );


    const roof =
    new THREE.Mesh(

        new THREE.ConeGeometry(
            3,
            2.3,
            4
        ),

        mat(0x8e3232)

    );

    roof.position.y =
    2.6;

    roof.rotation.y =
    Math.PI / 4;

    g.add(roof);


    g.add(
        box(
            0,
            -.3,
            1.67,
            .9,
            1.6,
            .15,
            0x5b3828
        )
    );


    g.add(
        box(
            -1.2,
            .5,
            1.68,
            .75,
            .75,
            .12,
            0x6db8e8
        )
    );


    g.add(
        box(
            1.2,
            .5,
            1.68,
            .75,
            .75,
            .12,
            0x6db8e8
        )
    );


    return g;
}


/* =====================================================
   TREE
===================================================== */

function tree(){

    const g =
    new THREE.Group();


    g.add(
        cyl(
            0,
            0,
            0,
            .45,
            3,
            0x70452b
        )
    );


    g.add(
        ball(
            0,
            2,
            0,
            1.6,
            0x3fa654
        )
    );


    g.add(
        ball(
            -1,
            2.2,
            0,
            1.15,
            0x48b35d
        )
    );


    g.add(
        ball(
            1,
            2.2,
            0,
            1.15,
            0x48b35d
        )
    );


    return g;
}


/* =====================================================
   LAMP
===================================================== */

function lamp(){

    const g =
    new THREE.Group();


    g.add(
        cyl(
            0,
            0,
            0,
            .13,
            2.5,
            0x555a69
        )
    );


    g.add(
        cyl(
            0,
            -1.25,
            0,
            .75,
            .15,
            0x30333c
        )
    );


    const shade =
    new THREE.Mesh(

        new THREE.ConeGeometry(
            1,
            .9,
            32,
            1,
            true
        ),

        mat(0xd4b56c)

    );

    shade.position.y =
    .95;

    g.add(shade);


    g.add(
        ball(
            0,
            .55,
            0,
            .28,
            0xffdd88
        )
    );


    return g;
}


/* =====================================================
   SWORD
===================================================== */

function sword(){

    const g =
    new THREE.Group();


    g.add(
        box(
            0,
            1.3,
            0,
            .3,
            4,
            .12,
            0xc9d1dc
        )
    );


    g.add(
        box(
            0,
            -.65,
            0,
            1.5,
            .18,
            .25,
            0xd5a82f
        )
    );


    g.add(
        cyl(
            0,
            -1.35,
            0,
            .16,
            1.2,
            0x593725
        )
    );


    return g;
}


/* =====================================================
   CAR
===================================================== */

function car(){

    const g =
    new THREE.Group();

    const red =
    0xd93838;


    g.add(
        box(
            0,
            .25,
            0,
            4.5,
            1,
            2,
            red
        )
    );


    g.add(
        box(
            0,
            1,
            0,
            2.6,
            .8,
            1.7,
            red
        )
    );


    g.add(
        box(
            0,
            1.05,
            .86,
            2.2,
            .5,
            .08,
            0x6b9dbd
        )
    );


    [
        [-1.45,-.35,1.05],
        [1.45,-.35,1.05],
        [-1.45,-.35,-1.05],
        [1.45,-.35,-1.05]

    ].forEach(p=>{

        const wheel =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .5,
                .5,
                .35,
                32
            ),

            mat(0x16171c)

        );

        wheel.rotation.x =
        Math.PI / 2;

        wheel.position.set(
            p[0],
            p[1],
            p[2]
        );

        g.add(wheel);

    });


    return g;
}


/* =====================================================
   ROBOT
===================================================== */

function robot(){

    const g =
    new THREE.Group();

    const metal =
    0x72798b;


    g.add(
        box(
            0,
            1,
            0,
            1.8,
            2,
            1.3,
            metal
        )
    );


    g.add(
        box(
            0,
            2.65,
            0,
            1.45,
            1.1,
            1.2,
            metal
        )
    );


    g.add(
        ball(
            -.35,
            2.7,
            .63,
            .13,
            0x62a8ff
        )
    );


    g.add(
        ball(
            .35,
            2.7,
            .63,
            .13,
            0x62a8ff
        )
    );


    g.add(
        box(
            -.5,
            -.5,
            0,
            .45,
            1.2,
            .5,
            metal
        )
    );


    g.add(
        box(
            .5,
            -.5,
            0,
            .45,
            1.2,
            .5,
            metal
        )
    );


    g.add(
        box(
            -1.25,
            .9,
            0,
            .4,
            1.7,
            .45,
            metal
        )
    );


    g.add(
        box(
            1.25,
            .9,
            0,
            .4,
            1.7,
            .45,
            metal
        )
    );


    return g;
}


/* =====================================================
   BOTTLE
===================================================== */

function bottle(){

    const g =
    new THREE.Group();


    g.add(
        cyl(
            0,
            0,
            0,
            .8,
            2.8,
            0x3f9b72
        )
    );


    g.add(
        cyl(
            0,
            1.7,
            0,
            .4,
            .7,
            0x3f9b72
        )
    );


    g.add(
        cyl(
            0,

            0,

        )

/* =====================================================
   GENERIC
===================================================== */

function generic(){

    const g =
    new THREE.Group();


    g.add(
        box(
            0,
            0,
            0,
            2.5,
            2.5,
            2.5,
            0x825cff
        )
    );


    return g;
}


/* =====================================================
   CREATE MODEL
===================================================== */

function createModel(text){

    const t =
    text.toLowerCase();


    if(t.includes("стул") || t.includes("chair"))
        return chair();

    if(t.includes("стол") || t.includes("table"))
        return table();

    if(t.includes("машин") || t.includes("авто") || t.includes("car"))
        return car();

    if(t.includes("дом") || t.includes("house"))
        return house();

    if(t.includes("дерев") || t.includes("tree"))
        return tree();

    if(t.includes("ламп") || t.includes("lamp"))
        return lamp();

    if(t.includes("меч") || t.includes("sword"))
        return sword();

    if(t.includes("робот") || t.includes("robot"))
        return robot();

    if(t.includes("бутыл") || t.includes("bottle"))
        return bottle();

    return generic();
}


/* =====================================================
   GENERATE
===================================================== */

function generate(){

    const text =
    promptInput.value.trim();


    if(!text){

        showError(
            "Напиши название объекта."
        );

        return;
    }


    loading.classList.add("show");

    status.textContent =
    "Генерируем модель «" +
    text +
    "»...";


    /*
       ВАЖНО:
       Здесь нет долгого API-запроса.
       Модель создаётся непосредственно
       в браузере.
    */

    setTimeout(()=>{

        try{

            if(currentModel){

                scene.remove(
                    currentModel
                );


                currentModel.traverse(
                    obj=>{

                        if(obj.geometry)
                            obj.geometry.dispose();

                        if(obj.material){

                            if(
                                Array.isArray(
                                    obj.material
                                )
                            ){

                                obj.material.forEach(
                                    m=>m.dispose()
                                );

                            }else{

                                obj.material.dispose();

                            }
                        }

                    }
                );

            }


            currentModel =
            createModel(text);


            /* CENTER */

            const box3 =
            new THREE.Box3()
            .setFromObject(
                currentModel
            );


            const center =
            box3.getCenter(
                new THREE.Vector3()
            );


            currentModel.position.sub(
                center
            );


            /* SCALE */

            const size =
            box3.getSize(
                new THREE.Vector3()
            );


            const max =
            Math.max(
                size.x,
                size.y,
                size.z
            );


            if(max > 0){

                const scale =
                3.5 / max;

                currentModel.scale.setScalar(
                    scale
                );

            }


            currentModel.position.y =
            -.3;


            scene.add(
                currentModel
            );


            rotationX = 0;

            rotationY = 0;

            distance = 6;


            modelTitle.textContent =
            "3D • " + text;


            status.innerHTML =
            "✅ Модель создана.<br>" +
            "Вращай её пальцем или мышью.";


            loading.classList.remove(
                "show"
            );


        }catch(err){

            console.error(err);

            loading.classList.remove(
                "show"
            );

            showError(
                "Ошибка создания: " +
                err.message
            );

        }

    },250);
}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

    errorBox.textContent =
    text;

    errorBox.style.display =
    "block";


    setTimeout(()=>{

        errorBox.style.display =
        "none";

    },5000);
}


/* =====================================================
   CONTROLS
===================================================== */

function setupControls(){

    canvas.addEventListener(
        "pointerdown",
        e=>{

            dragging = true;

            lastX = e.clientX;

            lastY = e.clientY;

            canvas.setPointerCapture(
                e.pointerId
            );

        }
    );


    canvas.addEventListener(
        "pointermove",
        e=>{

            if(!dragging)
                return;


            const dx =
            e.clientX - lastX;

            const dy =
            e.clientY - lastY;


            rotationY +=
            dx * .012;


            rotationX +=
            dy * .012;


            rotationX =
            Math.max(
                -1.4,
                Math.min(
                    1.4,
                    rotationX
                )
            );


            lastX =
            e.clientX;

            lastY =
            e.clientY;

        }
    );


    canvas.addEventListener(
        "pointerup",
        ()=>{

            dragging = false;

        }
    );


    canvas.addEventListener(
        "pointercancel",
        ()=>{

            dragging = false;

        }
    );


    canvas.addEventListener(
        "wheel",
        e=>{

            e.preventDefault();

            distance +=
            e.deltaY * .006;


            distance =
            Math.max(
                2.5,
                Math.min(
                    12,
                    distance
                )
            );

        },
        {
            passive:false
        }
    );


    document
    .getElementById("resetBtn")
    .onclick = ()=>{

        rotationX = 0;
        rotationY = 0;
        distance = 6;

    };


    document
    .getElementById("leftBtn")
    .onclick = ()=>{

        rotationY -= .5;

    };


    document
    .getElementById("rightBtn")
    .onclick = ()=>{

        rotationY += .5;

    };


    document
    .getElementById("generateBtn")
    .onclick =
    generate;


    promptInput.addEventListener(
        "keydown",
        e=>{

            if(e.key === "Enter")
                generate();

        }
    );


    document
    .querySelectorAll(".chip")
    .forEach(chip=>{

        chip.onclick = ()=>{

            promptInput.value =
            chip.dataset.name;

            generate();

        };

    });


    document
    .getElementById("downloadBtn")
    .onclick =
    downloadGLB;
}


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(currentModel){

        currentModel.rotation.y +=
        (
            rotationY -
            currentModel.rotation.y
        ) * .12;


        currentModel.rotation.x +=
        (
            rotationX -
            currentModel.rotation.x
        ) * .12;

    }


    camera.position.z +=
    (
        distance -
        camera.position.z
    ) * .1;


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   DOWNLOAD GLB
===================================================== */

async function downloadGLB(){

    if(!currentModel){

        showError(
            "Сначала создай модель."
        );

        return;
    }


    try{

        status.textContent =
        "Экспортируем GLB...";


        const exporter =
        new GLTFExporter();


        const result =
        await exporter.parseAsync(
            currentModel,
            {
                binary:true,
                onlyVisible:true
            }
        );


        const blob =
        new Blob(
            [result],
            {
                type:
                "model/gltf-binary"
            }
        );


        const url =
        URL.createObjectURL(
            blob
        );


        const a =
        document.createElement("a");


        let name =
        promptInput.value.trim();


        name =
        name
        .replace(
            /[^a-zA-Zа-яА-ЯёЁ0-9_-]/g,
            "_"
        );


        if(!name)
            name = "3d_model";


        a.href =
        url;

        a.download =
        name + ".glb";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            ()=>{
                URL.revokeObjectURL(
                    url
                );
            },
            1000
        );


        status.innerHTML =
        "✅ GLB готов!<br>" +
        "Файл можно отправить в Telegram.";


    }catch(err){

        console.error(err);

        showError(
            "Ошибка экспорта GLB: " +
            err.message
        );

        status.textContent =
        "Не удалось экспортировать модель.";

    }
}


/* =====================================================
   START
===================================================== */

try{

    init();

}catch(err){

    console.error(err);

    showError(
        "Не удалось запустить 3D: " +
        err.message
    );

}
