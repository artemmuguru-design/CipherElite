<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>3D World Multiplayer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#73c9ff;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}

#serverSelect{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);color:white;z-index:2000}

#serverSelect .s2{background:#2196f3;color:white}

#jump{position:fixed;right:20px;bottom:30px;width:76px;height:76px;z-index:50;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:white;font-size:30px;display:flex;align-items:center;justify-content:center;pointer-events:auto}

<body>

<div id="serverSelect">

</div>

    <h1>🎮 3D WORLD</h1>
    <p>Мультиплеер до 100 человек</p>

</div>

<div id="ui">
    <div id="playersList">👥 0</div>
    <div id="ping">📶 0ms</div>
</div>

<button id="jump">⬆</button>

<div id="joystick"><div id="stick"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }

<script type="module">
import * as THREE from 'three';

// ========== СЕТЬ ==========
let ws = null;
let myId = null;
let currentRoom = null;
const otherPlayers = new Map();
let pingTime = 0;

window.connectToServer = function(room) {
    currentRoom = room;
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const host = window.location.hostname === 'localhost' ? 'localhost:3000' : window.location.host;
    ws = new WebSocket(`${protocol}//${host}`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', room }));
        document.getElementById('serverSelect').style.display = 'none';
        document.getElementById('startScreen').classList.add('show');
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'yourId') {
            myId = data.id;
        }
        if (data.type === 'initPlayers') {
            data.players.forEach(p => {
                if (p.id !== myId) {
                    otherPlayers.set(p.id, { pos: p.pos, mesh: null });
                }
            });
            updateUI();
        }
        if (data.type === 'playerJoined') {
            if (data.id !== myId) {
                otherPlayers.set(data.id, { pos: data.pos, mesh: null });
                updateUI();
            }
        }
        if (data.type === 'playerMoved') {
            if (data.id !== myId && otherPlayers.has(data.id)) {
                otherPlayers.get(data.id).pos = data.pos;
            }
        }
        if (data.type === 'playerLeft') {
            if (otherPlayers.has(data.id)) {
                const p = otherPlayers.get(data.id);
                if (p.mesh) scene.remove(p.mesh);
                otherPlayers.delete(data.id);
                updateUI();
            }
        }
        if (data.type === 'pong') {
            pingTime = Date.now() - data.time;
            document.getElementById('ping').textContent = `📶 ${pingTime}ms`;
        }
    };

    ws.onclose = () => {
        alert('⚠️ Соединение потеряно! Перезагрузите страницу.');
    };
};

function updateUI() {
    document.getElementById('playersList').textContent = `👥 ${otherPlayers.size + 1}`;
}

function sendMove(pos) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'move', pos }));
    }
}

function sendJump() {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'jump' }));
    }
}

// Пинг
setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping', time: Date.now() }));
    }
}, 3000);

// ========== ИГРА ==========
let scene, camera, renderer, player, clock;
let gameStarted = false, grounded = true;
let velocityY = 0, joystickX = 0, joystickY = 0;
let cameraYaw = 0, targetCameraYaw = 0;
let cameraPitch = 0.25, targetCameraPitch = 0.25;
let walkTime = 0, moving = false;
const SPEED = 6.2, JUMP = 9.5, GRAVITY = 22;
const PLAYER_SCALE = 0.46, GROUND_Y = 0.62;
const WORLD_SIZE = 180, WORLD_LIMIT = 88;
const physicalObjects = [];
const spawnPoint = new THREE.Vector3(0, GROUND_Y, 0);
let deathZoneActive = false;
setTimeout(() => deathZoneActive = true, 5000);

const mat = {
    skin: new THREE.MeshStandardMaterial({ color: 0xb8b8b8, roughness: 0.78 }),
    black: new THREE.MeshStandardMaterial({ color: 0x080a0a, roughness: 0.58 }),
    jacket: new THREE.MeshStandardMaterial({ color: 0x101515, roughness: 0.74 }),
    blue: new THREE.MeshStandardMaterial({ color: 0x246d95, roughness: 0.68 }),
    jeans: new THREE.MeshStandardMaterial({ color: 0x182a31, roughness: 0.88 }),
    shoe: new THREE.MeshStandardMaterial({ color: 0x51352d, roughness: 0.82 }),
    sole: new THREE.MeshStandardMaterial({ color: 0xb7b7b7, roughness: 0.72 }),
    metal: new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.65, roughness: 0.35 })
};

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x73c9ff);
    camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.05, 600);
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.35));
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.prepend(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xbde9ff, 0x4c7740, 2);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(-30, 40, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -100;
    sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    scene.add(sun);

    createWorld();
    createPlayer();
    createEnvironment();
    camera.position.set(0, 4.4, 7.5);

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight, false);
    });

    setupJoystick();
    setupJump();
    setupCamera();

    document.getElementById('loading').classList.add('hidden');
    clock = new THREE.Clock();
    animate();
}

function addCollider(mesh, width, height, depth, offsetX = 0, offsetY = 0, offsetZ = 0) {
    physicalObjects.push({ mesh, width, height, depth, offsetX, offsetY, offsetZ });
}

function createWorld() {
    const grass = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE), new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 1 }));
    grass.rotation.x = -Math.PI / 2;
    grass.receiveShadow = true;
    scene.add(grass);
    const platform = new THREE.Mesh(new THREE.BoxGeometry(4, 0.35, 4), new THREE.MeshStandardMaterial({ color: 0xffd21f, roughness: 0.65 }));
    platform.position.set(0, 0.17, 0);
    platform.castShadow = true;
    platform.receiveShadow = true;
    scene.add(platform);
}

function createPhysicalCube(x, y, z, sx, sy, sz, color) {
    const cube = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
    cube.position.set(x, y, z);
    cube.castShadow = true;
    cube.receiveShadow = true;
    scene.add(cube);
    addCollider(cube, sx, sy, sz);
    return cube;
}

function createHouse(x, z, scale = 1) {
    const group = new THREE.Group();
    group.position.set(x, 0, z);
    group.scale.setScalar(scale);
    scene.add(group);
    const body = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 7), new THREE.MeshStandardMaterial({ color: 0xc8b28d, roughness: 0.9 }));
    body.position.y = 2.5;
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);
    const front = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 0.1));
    front.visible = false;
    front.position.set(0, 2.5, 3.5);
    group.add(front);
    const back = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 0.1));
    back.visible = false;
    back.position.set(0, 2.5, -3.5);
    group.add(back);
    const left = new THREE.Mesh(new THREE.BoxGeometry(0.1, 5, 7));
    left.visible = false;
    left.position.set(-4, 2.5, 0);
    group.add(left);
    const right = new THREE.Mesh(new THREE.BoxGeometry(0.1, 5, 7));
    right.visible = false;
    right.position.set(4, 2.5, 0);
    group.add(right);
    physicalObjects.push({ mesh: group, width: 8 * scale, height: 5 * scale, depth: 7 * scale, offsetX: 0, offsetY: 0, offsetZ: 0 });
    const roof = new THREE.Mesh(new THREE.ConeGeometry(5.8, 3, 4), new THREE.MeshStandardMaterial({ color: 0x8b3028, roughness: 0.8 }));
    roof.position.y = 6.5;
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    group.add(roof);
    physicalObjects.push({ mesh: group, width: 10 * scale, height: 3 * scale, depth: 10 * scale, offsetX: 0, offsetY: 5 * scale, offsetZ: 0, roof: true });
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.8, 0.15), new THREE.MeshStandardMaterial({ color: 0x57382b }));
    door.position.set(0, 1.4, 3.56);
    door.castShadow = true;
    group.add(door);
    const win = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.3, 0.12), new THREE.MeshStandardMaterial({ color: 0x62c8ed, metalness: 0.2, roughness: 0.2 }));
    win.position.set(-2, 3.1, 3.57);
    group.add(win);
    const win2 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.3, 0.12), new THREE.MeshStandardMaterial({ color: 0x62c8ed, metalness: 0.2, roughness: 0.2 }));
    win2.position.set(2, 3.1, 3.57);
    group.add(win2);
}

function createTree(x, z, scale = 1) {
    const group = new THREE.Group();
    group.position.set(x, 0, z);
    group.scale.setScalar(scale);
    scene.add(group);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.85, 5, 12), new THREE.MeshStandardMaterial({ color: 0x70452b, roughness: 1 }));
    trunk.position.y = 2.5;
    trunk.castShadow = true;
    group.add(trunk);
    const leaves = [[0, 5.8, 0, 2.7], [-1.3, 5.5, 0, 2], [1.3, 5.5, 0, 2], [0, 7, 0, 2]];
    for (const p of leaves) {
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(p[3], 14, 10), new THREE.MeshStandardMaterial({ color: 0x277d35, roughness: 1 }));
        leaf.position.set(p[0], p[1], p[2]);
        leaf.castShadow = true;
        group.add(leaf);
    }
    physicalObjects.push({ mesh: group, width: 1.5 * scale, height: 5 * scale, depth: 1.5 * scale, offsetX: 0, offsetY: 0, offsetZ: 0 });
    physicalObjects.push({ mesh: group, width: 5.5 * scale, height: 4.5 * scale, depth: 5.5 * scale, offsetX: 0, offsetY: 5.8 * scale, offsetZ: 0, foliage: true });
}

function createRock(x, z, scale = 1) {
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(2.1 * scale, 1), new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 1 }));
    rock.position.set(x, 1.1 * scale, z);
    rock.rotation.set(0.2, 0.5, 0.15);
    rock.scale.y = 0.7;
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
    physicalObjects.push({ mesh: rock, width: 4.2 * scale, height: 2.2 * scale, depth: 4.2 * scale, offsetX: 0, offsetY: 0, offsetZ: 0 });
}

function createMountain(x, z, radius, height) {
    const mountain = new THREE.Mesh(new THREE.ConeGeometry(radius, height, 7, 3), new THREE.MeshStandardMaterial({ color: 0x666b5c, roughness: 1 }));
    mountain.position.set(x, height / 2, z);
    mountain.castShadow = true;
    mountain.receiveShadow = true;
    scene.add(mountain);
    physicalObjects.push({ mesh: mountain, width: radius * 2, height: height, depth: radius * 2, offsetX: 0, offsetY: 0, offsetZ: 0 });
    if (height > 12) {
        const snow = new THREE.Mesh(new THREE.ConeGeometry(radius * 0.42, height * 0.25, 7), new THREE.MeshStandardMaterial({ color: 0xe8eeee, roughness: 1 }));
        snow.position.y = height * 0.84;
        mountain.add(snow);
    }
}

function createEnvironment() {
    createHouse(-18, -18, 1);
    createHouse(20, -25, 0.9);
    createHouse(30, 12, 1.15);
    createHouse(-28, 25, 0.8);
    const trees = [[-12, -8, 1], [-25, -5, 1.1], [-32, -17, 0.9], [-15, 15, 1.2], [10, -15, 1], [15, 18, 1.1], [32, 22, 0.9], [-38, 10, 1.2], [40, -10, 1], [5, 30, 1.1], [-5, 35, 0.9]];
    for (const t of trees) createTree(t[0], t[1], t[2]);
    createRock(-6, -10, 1);
    createRock(6, -12, 0.8);
    createRock(12, 8, 1.3);
    createRock(-18, 8, 0.8);
    createRock(25, 5, 0.9);
    createRock(-35, -25, 1.4);
    createRock(36, 28, 1.2);
    createMountain(-65, -55, 25, 25);
    createMountain(65, -55, 30, 30);
    createMountain(-65, 45, 28, 27);
    createMountain(65, 50, 30, 32);
    createPhysicalCube(-8, 1.5, -5, 3, 3, 3, 0x555b60);
    createPhysicalCube(8, 2, -8, 4, 4, 4, 0x555b60);
    createPhysicalCube(-8, 1, 7, 2, 2, 2, 0x31556d);
    createPhysicalCube(15, 1, -2, 2, 2, 5, 0x806b4f);
    createPhysicalCube(-18, 1.5, -5, 3, 3, 3, 0x7c6550);
}

// ========== ДЖОЙСТИК ДЛЯ ТЕЛЕФОНА ==========
function setupJoystick() {
    const joy = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    let active = false, pointerId = null;
    let centerX = 0, centerY = 0;
    const max = 42;

    function update(x, y) {
        let dx = x - centerX;
        let dy = y - centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
        stick.style.transform = `translate3d(${dx}px,${dy}px,0)`;
        joystickX = dx / max;
        joystickY = dy / max;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
        if (e.clientX > innerWidth * 0.45) return;
        e.preventDefault();
        active = true;
        pointerId = e.pointerId;
        centerX = e.clientX;
        centerY = e.clientY;
        joy.style.left = centerX + 'px';
        joy.style.top = centerY + 'px';
        joy.classList.add('active');
        renderer.domElement.setPointerCapture(pointerId);
        update(e.clientX, e.clientY);
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
        if (!active || e.pointerId !== pointerId) return;
        update(e.clientX, e.clientY);
    });

    function end(e) {
        if (e.pointerId !== pointerId) return;
        active = false;
        pointerId = null;
        joystickX = 0;
        joystickY = 0;
        stick.style.transform = 'translate3d(0,0,0)';
        joy.classList.remove('active');
    }

    renderer.domElement.addEventListener('pointerup', end);
    renderer.domElement.addEventListener('pointercancel', end);
}

// ========== ПРЫЖОК ==========
function setupJump() {
    document.getElementById('jump').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (grounded && gameStarted) {
            velocityY = JUMP;
            grounded = false;
            sendJump();
        }
    });
}

// ========== КАМЕРА (поворот пальцем) ==========
function setupCamera() {
    let active = false, pointerId = null;
    let lastX = 0, lastY = 0;

    renderer.domElement.addEventListener('pointerdown', (e) => {
        if (e.clientX < innerWidth * 0.45) return;
        const jump = document.getElementById('jump').getBoundingClientRect();
        if (e.clientX >= jump.left && e.clientX <= jump.right && e.clientY >= jump.top && e.clientY <= jump.bottom) return;
        active = true;
        pointerId = e.pointerId;
        lastX = e.clientX;
        lastY = e.clientY;
        renderer.domElement.setPointerCapture(pointerId);
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
        if (!active || e.pointerId !== pointerId) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        targetCameraYaw -= dx * 0.006;
        targetCameraPitch += dy * 0.004;
        targetCameraPitch = THREE.MathUtils.clamp(targetCameraPitch, -0.85, 1.52);
        lastX = e.clientX;
        lastY = e.clientY;
    });

    function end(e) {
        if (e.pointerId !== pointerId) return;
        active = false;
        pointerId = null;
    }
    renderer.domElement.addEventListener('pointerup', end);
    renderer.domElement.addEventListener('pointercancel', end);
}

// ========== ФИЗИКА ==========
function getColliderData(obj) {
    const mesh = obj.mesh;
    const sx = mesh.scale.x || 1;
    const sy = mesh.scale.y || 1;
    const sz = mesh.scale.z || 1;
    return {
        x: mesh.position.x + (obj.offsetX || 0) * sx,
        y: mesh.position.y + (obj.offsetY || 0) * sy,
        z: mesh.position.z + (obj.offsetZ || 0) * sz,
        width: obj.width * sx,
        height: obj.height * sy,
        depth: obj.depth * sz
    };
}

function resolveStaticCollisions(prevX, prevY, prevZ) {
    const radius = 0.52;
    let landed = false;
    for (const obj of physicalObjects) {
        const c = getColliderData(obj);
        const minX = c.x - c.width / 2, maxX = c.x + c.width / 2;
        const minZ = c.z - c.depth / 2, maxZ = c.z + c.depth / 2;
        const top = c.y + c.height;
        const px = player.position.x, pz = player.position.z;
        const bottom = player.position.y;
        const ox = px + radius > minX && px - radius < maxX;
        const oz = pz + radius > minZ && pz - radius < maxZ;
        if (!ox || !oz) continue;
        if (velocityY <= 0 && bottom <= top + 0.35 && prevY >= top - 0.35) {
            player.position.y = top;
            velocityY = 0;
            grounded = true;
            landed = true;
            continue;
        }
        const oldX = prevX + radius > minX && prevX - radius < maxX;
        const oldZ = prevZ + radius > minZ && prevZ - radius < maxZ;
        if (!oldX && oldZ && px < minX) { player.position.x = minX - radius; continue; }
        if (!oldX && oldZ && px > maxX) { player.position.x = maxX + radius; continue; }
        if (oldX && !oldZ && pz < minZ) { player.position.z = minZ - radius; continue; }
        if (oldX && !oldZ && pz > maxZ) { player.position.z = maxZ + radius; continue; }
        if (ox && oz && bottom < top - 0.1) {
            const d = Math.min(Math.abs(px - minX), Math.abs(maxX - px), Math.abs(pz - minZ), Math.abs(maxZ - pz));
            if (d === Math.abs(px - minX)) player.position.x = minX - radius;
            else if (d === Math.abs(maxX - px)) player.position.x = maxX + radius;
            else if (d === Math.abs(pz - minZ)) player.position.z = minZ - radius;
            else player.position.z = maxZ + radius;
        }
    }
    return landed;
}

function updatePlayer(delta) {
    if (!gameStarted || !player) return;
    let x = joystickX, z = joystickY;
    const len = Math.sqrt(x * x + z * z);
    if (len > 1) { x /= len; z /= len; }
    moving = Math.abs(x) > 0.05 || Math.abs(z) > 0.05;
    const prevX = player.position.x, prevY = player.position.y, prevZ = player.position.z;
    const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
    const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
    const dir = new THREE.Vector3();
    dir.addScaledVector(forward, -z);
    dir.addScaledVector(right, x);
    if (dir.lengthSq() > 0) {
        dir.normalize();
        player.position.x += dir.x * SPEED * delta;
        player.position.z += dir.z * SPEED * delta;
        const targetRot = Math.atan2(dir.x, dir.z);
        player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, targetRot, Math.min(1, delta * 12));
    }
    velocityY -= GRAVITY * delta;
    player.position.y += velocityY * delta;
    grounded = false;
    if (player.position.y <= GROUND_Y) {
        player.position.y = GROUND_Y;
        velocityY = 0;
        grounded = true;
    }
    resolveStaticCollisions(prevX, prevY, prevZ);
    if (player.position.y <= GROUND_Y) {
        player.position.y = GROUND_Y;
        velocityY = 0;
        grounded = true;
    }
    player.position.x = THREE.MathUtils.clamp(player.position.x, -WORLD_LIMIT, WORLD_LIMIT);
    player.position.z = THREE.MathUtils.clamp(player.position.z, -WORLD_LIMIT, WORLD_LIMIT);
    if (deathZoneActive && player.position.y <= -5) respawnPlayer();
    animateCharacter(delta);
    sendMove({ x: player.position.x, y: player.position.y, z: player.position.z });
}

let respawning = false;
function respawnPlayer() {
    if (respawning) return;
    respawning = true;
    player.visible = false;
    setTimeout(() => {
        player.position.copy(spawnPoint);
        velocityY = 0;
        grounded = true;
        player.rotation.set(0, 0, 0);
        player.visible = true;
        respawning = false;
    }, 250);
}

function animateCharacter(delta) {
    if (!player) return;
    if (moving) {
        walkTime += delta * 10;
        const swing = Math.sin(walkTime) * 0.55;
        parts.leftArm.rotation.x = swing;
        parts.rightArm.rotation.x = -swing;
        parts.leftLeg.rotation.x = -swing;
        parts.rightLeg.rotation.x = swing;
        parts.body.position.y = 3.25 + Math.abs(Math.sin(walkTime * 2)) * 0.055;
    } else {
        parts.leftArm.rotation.x = THREE.MathUtils.lerp(parts.leftArm.rotation.x, 0, 0.15);
        parts.rightArm.rotation.x = THREE.MathUtils.lerp(parts.rightArm.rotation.x, 0, 0.15);
        parts.leftLeg.rotation.x = THREE.MathUtils.lerp(parts.leftLeg.rotation.x, 0, 0.15);
        parts.rightLeg.rotation.x = THREE.MathUtils.lerp(parts.rightLeg.rotation.x, 0, 0.15);
        parts.body.position.y = THREE.MathUtils.lerp(parts.body.position.y, 3.25, 0.12);
    }
}

function updateCamera(delta) {
    if (!player) return;
    const smooth = 1 - Math.pow(0.0005, delta);
    cameraYaw = THREE.MathUtils.lerp(cameraYaw, targetCameraYaw, smooth);
    cameraPitch = THREE.MathUtils.lerp(cameraPitch, targetCameraPitch, smooth);
    const dist = 7.4;
    const target = new THREE.Vector3(player.position.x, player.position.y + 2.35, player.position.z);
    const offset = new THREE.Vector3(Math.sin(cameraYaw) * dist * Math.cos(cameraPitch), 3.15 + Math.sin(cameraPitch) * dist, Math.cos(cameraYaw) * dist * Math.cos(cameraPitch));
    const desired = target.clone().add(offset);
    const follow = 1 - Math.pow(0.00005, delta);
    camera.position.lerp(desired, follow);
    camera.lookAt(target);
}

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    let delta = (now - (clock?.oldTime || now)) / 1000;
    if (clock) clock.oldTime = now;
    delta = Math.min(delta, 0.05);
    updatePlayer(delta);
    updateCamera(delta);
    // Отрисовка других игроков
    for (const [id, p] of otherPlayers) {
        if (!p.mesh) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.8, 0.6), new THREE.MeshStandardMaterial({ color: 0xff6b6b }));
            m.castShadow = true;
            scene.add(m);
            p.mesh = m;
        }
        p.mesh.position.set(p.pos.x, p.pos.y + 0.9, p.pos.z);
    }
    renderer.render(scene, camera);
}

// ========== ЗАПУСК ==========
document.getElementById('startButton').addEventListener('click', () => {
    gameStarted = true;
    document.getElementById('startScreen').classList.remove('show');
});

init();

console.log('📱 Игра запущена на телефоне! Подключитесь к серверу.');
</script>
