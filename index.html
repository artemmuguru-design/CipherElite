<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChugurHub</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ChugurHub">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1117">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
        .header{background:#161b22;border-bottom:1px solid #30363d;padding:15px;display:flex;align-items:center;gap:10px;flex-shrink:0}
        .header h1{font-size:20px;flex:1;color:#58a6ff;font-weight:bold}
        button{background:#238636;color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s;touch-action:manipulation}
        button:active{transform:scale(.95)}
        .btn-secondary{background:#21262d;border:1px solid #30363d}
        .btn-danger{background:#da3633}
        .btn-preview{background:#58a6ff;color:#000}
        .btn-pages{background:#a371f7;color:#fff}
        .btn-create-page{background:#f0883e;color:#fff}
        .btn-copy{background:#1f6feb;color:#fff}
        .tabs{display:flex;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0}
        .tab{flex:1;padding:12px;text-align:center;cursor:pointer;font-size:15px;color:#8b949e;border-bottom:2px solid transparent;user-select:none;touch-action:manipulation}
        .tab.active{color:#e6edf3;border-bottom-color:#58a6ff}
        .content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
        .repo-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s}
        .repo-card:active{border-color:#58a6ff;transform:scale(.98)}
        .repo-card h3{color:#58a6ff;margin-bottom:5px;font-size:18px}
        .repo-card p{color:#8b949e;font-size:14px;margin:3px 0}
        .repo-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
        .empty-state{text-align:center;padding:50px 20px;color:#8b949e}
        .empty-state .icon{font-size:60px;margin-bottom:20px}
        .empty-state button{margin-top:20px;font-size:16px;padding:12px 24px}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:100;padding:20px}
        .modal.show{display:flex}
        .modal-content{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;width:100%;max-width:400px}
        .modal-content h2{margin-bottom:15px;font-size:18px}
        input{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:12px;border-radius:6px;font-size:14px;margin-bottom:12px;font-family:inherit}
        .search-panel{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px;margin-bottom:10px}
        .search-input{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:8px 12px;border-radius:6px;font-size:14px;margin:0;font-family:inherit}
        .search-results{max-height:200px;overflow-y:auto;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px;margin-top:10px;display:none}
        .search-results.show{display:block}
        .search-result-item{padding:8px;margin-bottom:4px;background:#161b22;border:1px solid #30363d;border-radius:4px;cursor:pointer}
        .search-result-item:active{transform:scale(.98)}
        .search-result-line{color:#58a6ff;font-size:12px;font-weight:bold;margin-bottom:4px}
        .search-result-code{color:#e6edf3;font-family:'Courier New',monospace;font-size:12px;white-space:pre-wrap;word-break:break-all}
        .search-result-code mark{background:#f0883e;color:#000;padding:0 2px;border-radius:2px}
        .search-no-results{text-align:center;padding:20px;color:#8b949e;font-size:14px}

        .editor-wrap{display:flex;height:500px;background:#0d1117;border:1px solid #30363d;border-radius:6px;overflow:hidden}
        .gutter{flex-shrink:0;width:50px;height:100%;overflow:hidden;background:#161b22;border-right:1px solid #30363d;position:relative}
        .gutter-inner{font-family:'Courier New',monospace;font-size:13px;line-height:1.5;padding:12px 8px;text-align:right;color:#8b949e;white-space:pre;will-change:transform;user-select:none}
        #fileContent{flex:1;height:100%;background:#0d1117;color:#e6edf3;border:none;padding:12px;font-family:'Courier New',monospace;font-size:13px;line-height:1.5;resize:none;outline:none;overflow-y:auto;overflow-x:auto;white-space:pre;word-wrap:normal;tab-size:4}

        .file-item{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
        .file-item .file-name{flex:1;min-width:100px}
        iframe{width:100%;height:500px;background:#fff;border:none;border-radius:8px}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:12px 24px;border-radius:20px;font-size:14px;display:none;z-index:200}
        .toast.show{display:block;animation:fadeIn .3s}
        .site-url{background:#0d1117;border:1px solid #30363d;padding:8px;border-radius:6px;font-size:12px;color:#58a6ff;margin:5px 0;word-break:break-all;display:flex;justify-content:space-between;align-items:center}
        .site-url span{flex:1}
        @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 ChugurHub</h1>
        <button onclick="showCreateRepo()">+ Новый</button>
    </div>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('repos',this)">📁 Репозитории</div>
        <div class="tab" onclick="switchTab('pages',this)">🌐 Pages</div>
    </div>
    <div class="content" id="content"></div>

    <div class="modal" id="createRepoModal">
        <div class="modal-content">
            <h2>Создать репозиторий</h2>
            <input type="text" id="repoName" placeholder="Название репозитория">
            <textarea id="repoDesc" placeholder="Описание" rows="3" style="min-height:80px;width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:12px;border-radius:6px;font-size:14px;margin-bottom:12px;font-family:inherit;resize:vertical"></textarea>
            <button onclick="createRepo()">Создать</button>
            <button class="btn-secondary" onclick="closeModal('createRepoModal')" style="margin-left:10px">Отмена</button>
        </div>
    </div>
    <div class="modal" id="createFileModal">
        <div class="modal-content">
            <h2>Создать файл</h2>
            <input type="text" id="fileName" placeholder="Название файла (например, index.html)">
            <button onclick="createFile()">Создать</button>
            <button class="btn-secondary" onclick="closeModal('createFileModal')" style="margin-left:10px">Отмена</button>
        </div>
    </div>
    <div class="modal" id="createPageModal">
        <div class="modal-content">
            <h2>Создать страницу Pages</h2>
            <input type="text" id="pageName" placeholder="Название страницы (для адреса)">
            <button onclick="createPage()">Создать</button>
            <button class="btn-secondary" onclick="closeModal('createPageModal')" style="margin-left:10px">Отмена</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        let repos=[],currentRepo=null,currentFile=null,currentTab='repos',lineNumTimer=null,searchTimer=null;

        document.addEventListener('paste',function(e){
            if(e.target&&e.target.id==='fileContent'){
                e.preventDefault();
                var text=(e.clipboardData||window.clipboardData).getData('text/plain');
                var ta=e.target,s=ta.selectionStart,en=ta.selectionEnd,v=ta.value;
                setTimeout(function(){
                    ta.value=v.substring(0,s)+text+v.substring(en);
                    ta.selectionStart=ta.selectionEnd=s+text.length;
                    updateLineNumbers();
                },0);
            }
        },true);

        function updateLineNumbers(){
            var ta=document.getElementById('fileContent');
            var g=document.getElementById('gutterInner');
            if(!ta||!g)return;
            var n=ta.value.split('\n').length;
            var a=new Array(n);
            for(var i=0;i<n;i++)a[i]=i+1;
            g.textContent=a.join('\n');
        }

        function performSearch(){
            var si=document.getElementById('searchInput');
            var sr=document.getElementById('searchResults');
            var ta=document.getElementById('fileContent');
            if(!si||!sr||!ta)return;
            var q=si.value.trim();
            if(!q){sr.classList.remove('show');return}
            var lines=ta.value.split('\n'),res=[];
            var lq=q.toLowerCase();
            for(var i=0;i<lines.length;i++){
                if(lines[i].toLowerCase().indexOf(lq)!==-1){
                    res.push({n:i+1,c:lines[i],q:q});
                }
            }
            if(res.length===0){
                sr.innerHTML='<div class="search-no-results">🔍 Нет данных</div>';
            }else{
                var h='';
                for(var j=0;j<res.length;j++){
                    var r=res[j];
                    var hl=escHtml(r.c).replace(new RegExp('('+escRe(escHtml(r.q))+')','gi'),'<mark>$1</mark>');
                    h+='<div class="search-result-item" onclick="goToLine('+r.n+')">';
                    h+='<div class="search-result-line">Строка '+r.n+'</div>';
                    h+='<div class="search-result-code">'+hl+'</div></div>';
                }
                sr.innerHTML=h;
            }
            sr.classList.add('show');
        }

        function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
        function escHtml(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}

        function goToLine(ln){
            var ta=document.getElementById('fileContent');
            if(!ta)return;
            var lines=ta.value.split('\n'),pos=0;
            for(var i=0;i<ln-1;i++)pos+=lines[i].length+1;
            ta.focus();
            ta.setSelectionRange(pos,pos+lines[ln-1].length);
            var lh=19.5;
            ta.scrollTop=(ln-1)*lh-100;
        }

        function loadData(){
            var s=localStorage.getItem('chugurhub_data');
            if(s){try{repos=JSON.parse(s)}catch(e){repos=[]}}
            if(repos.length===0){
                repos.push({id:Date.now(),name:'demo-site',description:'Демонстрационный сайт',files:[{id:Date.now()+1,name:'index.html',content:'<!DOCTYPE html>\n<html>\n<head>\n    <title>Мой сайт</title>\n    <style>\n        body {\n            font-family: Arial;\n            text-align: center;\n            padding: 50px;\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            color: white;\n        }\n        h1 { font-size: 3em; }\n    </style>\n</head>\n<body>\n    <h1>🚀 ChugurHub работает!</h1>\n    <p>Это демонстрационная страница</p>\n</body>\n</html>'}],isPage:false});
                saveData();
            }
        }
        function saveData(){localStorage.setItem('chugurhub_data',JSON.stringify(repos))}

        function switchTab(tab,el){
            currentTab=tab;
            document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
            el.classList.add('active');
            if(tab==='repos')showReposList();else showPagesList();
        }

        function showReposList(){
            var c=document.getElementById('content');
            if(repos.length===0){
                c.innerHTML='<div class="empty-state"><div class="icon">📦</div><h2>Нет репозиториев</h2><p>Создайте свой первый репозиторий!</p><button onclick="showCreateRepo()">+ Создать новый репозиторий</button></div>';
                return;
            }
            var h='';
            repos.forEach(function(r){
                var fc=r.files?r.files.length:0;
                var hi=r.files&&r.files.some(function(f){return f.name==='index.html'});
                h+='<div class="repo-card"><h3>📁 '+r.name+'</h3><p>'+(r.description||'Нет описания')+' • '+fc+' файл(ов)</p><div class="repo-actions">';
                h+='<button onclick="openRepo('+r.id+')">Открыть</button>';
                if(hi)h+='<button class="btn-pages" onclick="openSiteInNewTab('+r.id+')">🌐 Открыть сайт</button>';
                h+='<button class="btn-create-page" onclick="showCreatePage('+r.id+')">📄 Создать Pages</button>';
                h+='</div></div>';
            });
            c.innerHTML=h;
        }

        function showPagesList(){
            var c=document.getElementById('content');
            var pr=repos.filter(function(r){return r.isPage===true&&r.files&&r.files.some(function(f){return f.name==='index.html'})});
            if(pr.length===0){c.innerHTML='<div class="empty-state"><div class="icon">🌐</div><h2>Нет страниц</h2><p>Нажмите "Создать Pages" в репозитории с файлом index.html</p></div>';return}
            var h='<p style="margin-bottom:20px;color:#8b949e">Ваши опубликованные сайты:</p>';
            pr.forEach(function(r){
                h+='<div class="repo-card"><h3>🌐 '+(r.pageName||r.name)+'</h3><p>Репозиторий: '+r.name+'</p>';
                h+='<div class="site-url"><span>chugurhub.'+(r.pageName||r.name)+'.pages.app</span></div>';
                h+='<div class="repo-actions"><button class="btn-preview" onclick="openSiteInNewTab('+r.id+')">↗ Открыть в новой вкладке</button>';
                h+='<button class="btn-danger" onclick="deletePage('+r.id+')">🗑 Удалить страницу</button></div></div>';
            });
            c.innerHTML=h;
        }

        function showCreatePage(id){
            var r=repos.find(function(x){return x.id===id});
            if(!r){showToast('Репозиторий не найден!');return}
            if(!r.files||!r.files.some(function(f){return f.name==='index.html'})){showToast('Сначала создайте файл index.html!');return}
            currentRepo=r;
            document.getElementById('createPageModal').classList.add('show');
            document.getElementById('pageName').value=r.name+'-page';
        }

        function createPage(){
            var pn=document.getElementById('pageName').value.trim();
            if(!pn){showToast('Введите название страницы!');return}
            if(!currentRepo){showToast('Ошибка!');return}
            currentRepo.isPage=true;currentRepo.pageName=pn;
            saveData();closeModal('createPageModal');showReposList();showToast('Страница создана!');
        }

        function deletePage(id){
            if(confirm('Удалить эту страницу?')){
                var r=repos.find(function(x){return x.id===id});
                if(r){r.isPage=false;delete r.pageName;saveData();showPagesList();showToast('Страница удалена')}
            }
        }

        function deleteRepo(id){
            if(confirm('Удалить репозиторий и все его файлы?')){
                repos=repos.filter(function(r){return r.id!==id});
                saveData();showReposList();showToast('Репозиторий удалён');
            }
        }

        function openSiteInNewTab(id){
            var r=repos.find(function(x){return x.id===id});if(!r)return;
            var f=r.files.find(function(x){return x.name==='index.html'});if(!f)return;
            var b=new Blob([f.content],{type:'text/html'});
            window.open(URL.createObjectURL(b),'_blank');
            showToast('Сайт открыт: chugurhub.'+(r.pageName||r.name)+'.pages.app');
        }

        function showCreateRepo(){
            document.getElementById('createRepoModal').classList.add('show');
            document.getElementById('repoName').value='';
            document.getElementById('repoDesc').value='';
        }

        function createRepo(){
            var n=document.getElementById('repoName').value.trim();
            var d=document.getElementById('repoDesc').value.trim();
            if(!n){showToast('Введите название!');return}
            repos.push({id:Date.now(),name:n,description:d,files:[],isPage:false});
            saveData();closeModal('createRepoModal');showReposList();showToast('Репозиторий создан!');
        }

        function openRepo(id){
            currentRepo=repos.find(function(x){return x.id===id});if(!currentRepo)return;
            var c=document.getElementById('content');
            var h='<div style="margin-bottom:15px;display:flex;gap:10px;flex-wrap:wrap">';
            h+='<button class="btn-secondary" onclick="showReposList()">← Назад</button>';
            h+='<button onclick="showCreateFile()">+ Файл</button>';
            h+='<button class="btn-danger" onclick="deleteRepo('+currentRepo.id+')">🗑 Удалить репозиторий</button>';
            var hi=currentRepo.files.some(function(f){return f.name==='index.html'});
            if(hi){
                h+='<button class="btn-pages" onclick="openSiteInNewTab('+currentRepo.id+')">🌐 Сайт</button>';
                h+='<button class="btn-create-page" onclick="showCreatePage('+currentRepo.id+')">📄 Создать Pages</button>';
            }
            h+='</div><h2 style="margin-bottom:15px">📁 '+currentRepo.name+'</h2>';
            if(currentRepo.files&&currentRepo.files.length>0){
                currentRepo.files.forEach(function(f){
                    h+='<div class="file-item"><span>'+getFileIcon(f.name)+'</span><span class="file-name">'+f.name+'</span>';
                    h+='<button onclick="openFile('+f.id+')">Открыть</button>';
                    h+='<button class="btn-danger" onclick="deleteFile('+f.id+')">🗑</button></div>';
                });
            }else{
                h+='<p style="color:#8b949e;text-align:center;padding:20px">Нет файлов. Создайте файл index.html чтобы опубликовать сайт!</p>';
            }
            c.innerHTML=h;
        }

        function showCreateFile(){
            document.getElementById('createFileModal').classList.add('show');
            document.getElementById('fileName').value='';
        }

        function createFile(){
            var n=document.getElementById('fileName').value.trim();
            if(!n){showToast('Введите название файла!');return}
            currentRepo.files.push({id:Date.now(),name:n,content:n.endsWith('.html')?'<!DOCTYPE html>\n<html>\n<head>\n    <title>Новая страница</title>\n</head>\n<body>\n    <h1>Привет, ChugurHub!</h1>\n</body>\n</html>':''});
            saveData();closeModal('createFileModal');openRepo(currentRepo.id);showToast('Файл создан!');
        }

        function openFile(id){
            currentFile=currentRepo.files.find(function(f){return f.id===id});if(!currentFile)return;
            var c=document.getElementById('content');
            var h='<div style="margin-bottom:15px;display:flex;gap:10px;flex-wrap:wrap">';
            h+='<button class="btn-secondary" onclick="openRepo('+currentRepo.id+')">← Назад</button>';
            h+='<button onclick="saveFile()">💾 Сохранить</button>';
            h+='<button class="btn-copy" onclick="copyFileContent()">📋 Копировать код</button>';
            h+='<button class="btn-secondary" onclick="downloadCurrentFile()">⬇ Скачать</button>';
            if(currentFile.name.endsWith('.html')){
                h+='<button class="btn-preview" onclick="previewFile()">👁 Предпросмотр</button>';
                h+='<button class="btn-pages" onclick="openSiteInNewTab('+currentRepo.id+')">🌐 Сайт</button>';
                h+='<button class="btn-create-page" onclick="showCreatePage('+currentRepo.id+')">📄 Создать Pages</button>';
            }
            h+='</div>';
            h+='<h3 style="margin-bottom:10px">'+getFileIcon(currentFile.name)+' '+currentFile.name+'</h3>';

            h+='<div class="search-panel"><input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по коду..."><div class="search-results" id="searchResults"></div></div>';

            h+='<div class="editor-wrap"><div class="gutter"><div class="gutter-inner" id="gutterInner">1</div></div>';
            h+='<textarea id="fileContent" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea></div>';

            c.innerHTML=h;

            var ta=document.getElementById('fileContent');
            var gutter=document.getElementById('gutterInner');
            var si=document.getElementById('searchInput');

            ta.value=currentFile.content;
            updateLineNumbers();

            ta.addEventListener('scroll',function(){
                requestAnimationFrame(function(){
                    gutter.style.transform='translateY(-'+ta.scrollTop+'px)';
                });
            });

            ta.addEventListener('input',function(){
                clearTimeout(lineNumTimer);
                lineNumTimer=setTimeout(updateLineNumbers,50);
            });

            si.addEventListener('input',function(){
                clearTimeout(searchTimer);
                searchTimer=setTimeout(performSearch,150);
            });
        }

        function copyFileContent(){
            var ta=document.getElementById('fileContent');
            if(!ta)return;
            
            // Сохраняем текущее значение в currentFile перед копированием
            if(currentFile){
                currentFile.content = ta.value;
                saveData();
            }
            
            // Копируем текст в буфер обмена
            if(navigator.clipboard && navigator.clipboard.writeText){
                navigator.clipboard.writeText(ta.value).then(function(){
                    showToast('📋 Код скопирован в буфер обмена!');
                }).catch(function(){
                    // Fallback для старых браузеров
                    fallbackCopy(ta.value);
                });
            } else {
                fallbackCopy(ta.value);
            }
        }

        function fallbackCopy(text){
            var tempTextarea = document.createElement('textarea');
            tempTextarea.value = text;
            tempTextarea.style.position = 'fixed';
            tempTextarea.style.opacity = '0';
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            tempTextarea.setSelectionRange(0, 99999); // Для мобильных устройств
            
            try {
                var successful = document.execCommand('copy');
                if(successful){
                    showToast('📋 Код скопирован в буфер обмена!');
                } else {
                    showToast('❌ Не удалось скопировать код');
                }
            } catch (err) {
                showToast('❌ Ошибка при копировании: ' + err);
            }
            
            document.body.removeChild(tempTextarea);
        }

        function saveFile(){
            var ta=document.getElementById('fileContent');
            if(ta&&currentFile){currentFile.content=ta.value;saveData();showToast('Сохранено!')}
        }

        function downloadCurrentFile(){
            if(!currentFile)return;
            var ta=document.getElementById('fileContent');
            var ct=ta?ta.value:currentFile.content;
            var b=new Blob([ct],{type:'text/plain'});
            var u=URL.createObjectURL(b);
            var a=document.createElement('a');a.href=u;a.download=currentFile.name;
            document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
            showToast('Файл скачан: '+currentFile.name);
        }

        function previewFile(){
            var ta=document.getElementById('fileContent');if(!ta)return;
            currentFile.content=ta.value;
            var c=document.getElementById('content');
            c.innerHTML='<button class="btn-secondary" onclick="openFile('+currentFile.id+')">← Назад</button><br><br>';
            var b=new Blob([currentFile.content],{type:'text/html'});
            var ifr=document.createElement('iframe');
            ifr.style.cssText='width:100%;height:500px;background:#fff;border:none;border-radius:8px';
            ifr.src=URL.createObjectURL(b);c.appendChild(ifr);
            setTimeout(saveData,0);
        }

        function deleteFile(id){
            if(confirm('Удалить этот файл?')){
                currentRepo.files=currentRepo.files.filter(function(f){return f.id!==id});
                saveData();openRepo(currentRepo.id);showToast('Файл удалён');
            }
        }

        function getFileIcon(n){
            if(n.endsWith('.html'))return'🌐';if(n.endsWith('.css'))return'🎨';if(n.endsWith('.js'))return'⚡';
            if(n.endsWith('.json'))return'📋';if(n.endsWith('.md'))return'📝';if(n.endsWith('.py'))return'🐍';return'📄';
        }

        function closeModal(id){document.getElementById(id).classList.remove('show')}

        function showToast(m){
            var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
            setTimeout(function(){t.classList.remove('show')},3000);
        }

        document.querySelectorAll('.modal').forEach(function(m){
            m.addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
        });

        loadData();showReposList();
    </script>
</body>
</html>
